# Nordlys configuration. Copy to ~/.config/nordlys/nordlys.toml.
# Every key is optional; anything left out uses the default shown here.
# Changes apply live: nordlysctl reload (the compositor will also watch this file).

[theme]
mode = "dark"            # "dark" or "light"
# accent = "#8AB4FF"     # unset = the mode's own accent
blur = 24                # px, 0 turns blur off
reduce_transparency = false
reduce_motion = false

[stage]
layout = "auto"          # "auto", "ultrawide", "rails" or "peek"
split = 0.6              # main pane's share in two-up
shelf_fps = 10           # redraw rate for windows waiting on the shelf

# App groups: Super G, then the key. The first app takes the stage,
# the rest wait on the shelf in order.
[[group]]
name = "Nordlys dev"
key = "d"
apps = ["helix", "foot", "nautilus"]
open_in = "new-workspace"
dir = "~/code/nordlys"

[[group]]
name = "Research"
key = "r"
apps = ["firefox", "helix"]
open_in = "current"
reuse_running = false
