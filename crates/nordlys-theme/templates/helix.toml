# Generated by nordlys-theme from nordlys.toml; it rewrites this file.
# For changes of your own, make a theme that inherits it:
#   inherits = "nordlys"   in ~/.config/helix/themes/mine.toml

# Syntax
"attribute" = "yellow"
"comment" = { fg = "dim", modifiers = ["italic"] }
"constant" = "yellow"
"constant.builtin" = "magenta"
"constant.character.escape" = "cyan"
"constant.numeric" = "yellow"
"constructor" = "cyan"
"function" = "blue"
"function.builtin" = "blue"
"function.macro" = "magenta"
"keyword" = "magenta"
"keyword.control" = "magenta"
"keyword.directive" = "magenta"
"keyword.storage" = "magenta"
"label" = "cyan"
"namespace" = "cyan"
"operator" = "muted"
"punctuation" = "muted"
"punctuation.bracket" = "muted"
"punctuation.delimiter" = "muted"
"special" = "cyan"
"string" = "green"
"string.regexp" = "cyan"
"string.special" = "cyan"
"tag" = "blue"
"type" = "cyan"
"type.builtin" = "cyan"
"variable" = "text"
"variable.builtin" = "red"
"variable.other.member" = "text"
"variable.parameter" = "text"

# Markup
"markup.heading" = { fg = "accent", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "blue", modifiers = ["underlined"] }
"markup.link.text" = "cyan"
"markup.list" = "magenta"
"markup.quote" = "muted"
"markup.raw" = "green"

# Version control
"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "yellow"

# Interface. No background, so the frosted terminal shows through.
"ui.background" = {}
"ui.text" = "text"
"ui.text.focus" = { fg = "text", bg = "raised" }
"ui.text.inactive" = "dim"
"ui.cursor" = { fg = "ground", bg = "muted" }
"ui.cursor.primary" = { fg = "on_accent", bg = "accent" }
"ui.cursor.match" = { bg = "border", modifiers = ["bold"] }
"ui.cursorline.primary" = { bg = "surface" }
"ui.selection" = { bg = "raised" }
"ui.selection.primary" = { bg = "selection" }
"ui.linenr" = "border"
"ui.linenr.selected" = "muted"
"ui.gutter" = {}
"ui.statusline" = { fg = "muted", bg = "surface" }
"ui.statusline.inactive" = { fg = "dim", bg = "surface" }
"ui.statusline.normal" = { fg = "on_accent", bg = "accent", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "ground", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "ground", bg = "magenta", modifiers = ["bold"] }
"ui.bufferline" = { fg = "dim", bg = "surface" }
"ui.bufferline.active" = { fg = "text", bg = "raised" }
"ui.bufferline.background" = { bg = "surface" }
"ui.popup" = { fg = "text", bg = "raised" }
"ui.window" = "border"
"ui.help" = { fg = "text", bg = "raised" }
"ui.menu" = { fg = "text", bg = "raised" }
"ui.menu.selected" = { fg = "on_accent", bg = "accent" }
"ui.menu.scroll" = { fg = "muted", bg = "border" }
"ui.virtual.whitespace" = "border"
"ui.virtual.ruler" = { bg = "surface" }
"ui.virtual.indent-guide" = "raised"
"ui.virtual.inlay-hint" = "dim"
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }

# Diagnostics
"error" = "red"
"warning" = "yellow"
"info" = "blue"
"hint" = "cyan"
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "cyan", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

[palette]
ground = "%ground%"
surface = "%surface%"
raised = "%raised%"
border = "%border%"
text = "%text%"
muted = "%muted%"
dim = "%dim%"
accent = "%accent%"
on_accent = "%on_accent%"
selection = "%selection%"
red = "%red%"
green = "%green%"
yellow = "%yellow%"
blue = "%blue%"
magenta = "%magenta%"
cyan = "%cyan%"
