# Helix, used by the "Nordlys dev" app group. Written once by nordlys-theme
# and then yours to edit; themes/nordlys.toml follows the palette.
theme = "nordlys"

[editor]
true-color = true
color-modes = true
cursorline = true
bufferline = "multiple"
line-number = "relative"
rulers = [100]
idle-timeout = 250

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "│"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-type"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-inlay-hints = true
