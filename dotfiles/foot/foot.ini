# foot, the Nordlys terminal (Super+Enter).
# Written once by nordlys-theme and then yours to edit. The colours live in
# nordlys.ini, which nordlys-theme rewrites whenever the palette changes.
include=~/.config/foot/nordlys.ini

[main]
font=JetBrains Mono:size=11
font-bold=JetBrains Mono:weight=bold:size=11
pad=14x12 center
initial-window-size-chars=100x30

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[key-bindings]
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o
