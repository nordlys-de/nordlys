# mpv keys on top of the defaults (see `mpv --input-keylist`).
WHEEL_UP    add volume 5
WHEEL_DOWN  add volume -5
RIGHT       seek  5
LEFT        seek -5
UP          seek  60
DOWN        seek -60
l           cycle-values loop-file "inf" "no"
i           script-binding stats/display-stats-toggle
c           cycle sub
a           cycle audio
Ctrl+s      screenshot video
