# mpv, the Nordlys video and music player.
# Written once by nordlys-theme and then yours to edit. Colours live in
# nordlys.conf, which nordlys-theme rewrites whenever the palette changes.
include="~~/nordlys.conf"

# Video
vo=gpu-next
hwdec=auto-safe
profile=high-quality

# Window: the stage gives it room; don't fight the compositor.
keep-open=yes
autofit-larger=90%x90%
title="${media-title}"
save-position-on-quit=yes
watch-later-options-remove=fullscreen

# On-screen text in the shell's typeface
osd-font="Inter"
osd-font-size=30
osd-border-size=1.5
osd-bar-h=1.6
osd-duration=900
sub-font="Inter"
sub-font-size=44
sub-border-size=2.5

# Audio
volume=80
volume-max=150
audio-display=embedded-first

# Screenshots go where Print puts them.
screenshot-dir="~/Pictures/Screenshots"
screenshot-template="mpv-%F-%P"
screenshot-format=png

# Streams
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
